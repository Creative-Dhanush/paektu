name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  posture:
    name: compliance posture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Paektu checks its own repository. If the tool cannot hold itself to
      # its own controls, it has no business being pointed at anyone else's code.
      - name: Check posture
        run: paektu check --strict

      - name: Generate report
        if: always()
        run: paektu report --out posture.md

      # Uploaded even on failure, because the run you most want a report from is
      # the one that just failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posture-report
          path: posture.md
