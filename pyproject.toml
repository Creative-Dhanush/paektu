[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plumbline"
version = "0.1.0"
description = "Security controls as code, with evidence collection and documentation drift detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhanush N" }]
keywords = [
  "compliance",
  "security",
  "soc2",
  "iso27001",
  "controls-as-code",
  "documentation-drift",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
plumbline = "plumbline.cli:main"

[project.urls]
Homepage = "https://github.com/Creative-Dhanush/plumbline"
Issues = "https://github.com/Creative-Dhanush/plumbline/issues"

[tool.setuptools.packages.find]
include = ["plumbline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
